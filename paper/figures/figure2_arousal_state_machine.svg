<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" width="920" height="520" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
    </marker>
  </defs>

  <text x="460" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">
    Figure 2 — Arousal state machine (rate-driven, +30/s presence, -12/s always)
  </text>

  <!-- CALM -->
  <circle cx="150" cy="180" r="90" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
  <text x="150" y="165" text-anchor="middle" font-size="16" font-weight="bold">CALM</text>
  <text x="150" y="185" text-anchor="middle" font-size="11" fill="#444">baseline, settled</text>
  <text x="150" y="203" text-anchor="middle" font-size="10.5" fill="#666">rewards sustained</text>
  <text x="150" y="217" text-anchor="middle" font-size="10.5" fill="#666">calm (30 s interval,</text>
  <text x="150" y="231" text-anchor="middle" font-size="10.5" fill="#666">post-warm-up)</text>

  <!-- AROUSAL -->
  <circle cx="460" cy="180" r="90" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
  <text x="460" y="165" text-anchor="middle" font-size="16" font-weight="bold">AROUSAL</text>
  <text x="460" y="185" text-anchor="middle" font-size="11" fill="#444">watch only</text>
  <text x="460" y="203" text-anchor="middle" font-size="10.5" fill="#666">no intervention</text>
  <text x="460" y="217" text-anchor="middle" font-size="10.5" fill="#666">of any kind</text>

  <!-- CORRECTION -->
  <circle cx="770" cy="180" r="90" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
  <text x="770" y="160" text-anchor="middle" font-size="16" font-weight="bold">CORRECTION</text>
  <text x="770" y="180" text-anchor="middle" font-size="10.5" fill="#666">800 Hz cue every 2 s</text>
  <text x="770" y="196" text-anchor="middle" font-size="10.5" fill="#666">exposure 0: cue only</text>
  <text x="770" y="212" text-anchor="middle" font-size="10.5" fill="#666">exposure 1: + pivot</text>
  <text x="770" y="228" text-anchor="middle" font-size="10.5" fill="#666">exposure 2: + approach</text>

  <!-- forward transitions (top) -->
  <line x1="240" y1="150" x2="370" y2="150" stroke="#222" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="305" y="130" text-anchor="middle" font-size="12">arousal ≥ 20</text>
  <text x="305" y="145" text-anchor="middle" font-size="11" fill="#666">(ENTER)</text>

  <line x1="550" y1="150" x2="680" y2="150" stroke="#222" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="615" y="130" text-anchor="middle" font-size="12">arousal ≥ 70</text>
  <text x="615" y="145" text-anchor="middle" font-size="11" fill="#666">(ENTER)</text>

  <!-- CORRECTION -> AROUSAL (exit, just below top row) -->
  <line x1="680" y1="205" x2="550" y2="205" stroke="#222" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="615" y="225" text-anchor="middle" font-size="12">arousal &lt; 60</text>
  <text x="615" y="240" text-anchor="middle" font-size="11" fill="#666">(EXIT)</text>

  <!-- AROUSAL -> CALM (exit + reward), curved below -->
  <path d="M 430 268 C 380 340, 220 340, 165 270" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="300" y="365" text-anchor="middle" font-size="12">arousal &lt; 12 (EXIT)</text>
  <text x="300" y="381" text-anchor="middle" font-size="12" font-weight="bold">REWARD (dog disengaged)</text>

  <!-- CORRECTION -> CALM (exit + reward + stop), long curve below both -->
  <path d="M 740 268 C 700 460, 220 460, 160 272" fill="none" stroke="#222" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow2)"/>
  <text x="460" y="450" text-anchor="middle" font-size="12">arousal &lt; 12</text>
  <text x="460" y="466" text-anchor="middle" font-size="12" font-weight="bold">REWARD + immediate STOP</text>

  <text x="460" y="500" text-anchor="middle" font-size="10.5" fill="#777">
    Source: optimized/docs/ARCHITECTURE.md §2 (arousal state machine); timing unit-tested in optimized/tests/test_state.py
  </text>
</svg>
